<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores para ti 🌷</title>
  <style>
   body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url('petalos.gif') center/cover no-repeat, linear-gradient(135deg, #fce4ec, #f8bbd0);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .tarjeta {
      background: #ee7bdb;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 320px;
      width: 90%;
      background: url('petalos.gif') center/cover no-repeat, linear-gradient(135deg, #ff5b91, #eb598c);

    }

    .jardin {
      position: relative;
      height: 220px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .tallo {
      width: 8px;
      height: 120px;
      background-color: #4caf50;
      border-radius: 4px;
      position: absolute;
      bottom: 25px;
      z-index: 1;
    }

    .hoja {
      width: 28px;
      height: 14px;
      background-color: #66bb6a;
      position: absolute;
      border-radius: 14px 0;
    }
    .hoja-izq {
      bottom: 60px;
      left: 124px;
      transform: rotate(-30deg);
    }
    .hoja-der {
      bottom: 80px;
      right: 124px;
      transform: rotate(30deg) scaleX(-1);
    }

    .flor {
      position: absolute;
      bottom: 130px;
      width: 80px;
      height: 80px;
      z-index: 2;
      animation: suaveBamboleo 3s ease-in-out infinite alternate;
    }

    .petalo {
      position: absolute;
      width: 32px;
      height: 50px;
      background: #ff0156;
      border-radius: 50%;
      top: 15px;
      left: 24px;
      opacity: 0.9;
    }

    .p1 { transform: rotate(0deg) translateY(-18px); }
    .p2 { transform: rotate(60deg) translateY(-18px); }
    .p3 { transform: rotate(120deg) translateY(-18px); }
    .p4 { transform: rotate(180deg) translateY(-18px); }
    .p5 { transform: rotate(240deg) translateY(-18px); }
    .p6 { transform: rotate(300deg) translateY(-18px); }

    .centro {
      position: absolute;
      width: 26px;
      height: 26px;
      background: #ffd54f;
      border-radius: 50%;
      top: 27px;
      left: 27px;
      box-shadow: 0 0 8px rgba(255, 213, 79, 0.8);
      z-index: 3;
    }

    .maceta {
      width: 60px;
      height: 45px;
      background: #d87d4a;
      clip-path: polygon(10% 100%, 90% 100%, 100% 0%, 0% 0%);
      position: absolute;
      bottom: 0;
      z-index: 3;
    }

    h1 {
      color: #90023f;
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    p {
      color: #000000;
      font-size: 0.95rem;
      line-height: 1.4;
      margin: 10px 0 0 0;
    }

    @keyframes suaveBamboleo {
      0% {
        transform: rotate(-4deg);
      }
      100% {
        transform: rotate(4deg);
      }
    }

    .photo {
        width: 100%;
        max-width: 220px;        
        height: 220px;
        object-fit: cover;        
        border-radius: 16px;
        border: 4px solid #ffffff;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        display: block;
        margin: 15px auto 0 auto;  
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

    .photo:hover {
        transform: scale(1.04) rotate(1.5deg);
        box-shadow: 0 12px 24px rgba(255, 64, 129, 0.25);
        }
    .player-card {
      width: 180px;
      margin: 0 auto; /* Centra la tarjeta horizontalmente */
      background: linear-gradient(145deg, #9b0c94, #7d108b);
      color: #ffffff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      box-sizing: border-box;
    }

    /* Portada del álbum */
    .photo_2 {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: block;
    }

    .track-info {
      margin: 8px 0 10px; 
    }

    .title {
      font-size: 0.8rem;
      font-weight: 700;
      margin: 0;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: 0.68rem;
      color: #e0d0e8;
      margin: 2px 0 0;
    }

    .player-card button {
      background-color: #af0b5d;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 8px;
      font-size: 0.65rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      margin: 0 1px;
      transition: all 0.2s ease-in-out;
    }

    .player-card button:hover {
      background-color: #c32876;
      border-color: #af2c6e;
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(250, 1, 125, 0.35);
    }

    .player-card button:active {
      transform: translateY(0);
    }

    .glass-card{
      max-width: 380px;
      margin: 20px auto;
      padding: 20px 24px;

      background: rgba(255, 255, 255, 0.12); 
      backdrop-filter: blur(12px);          
      -webkit-backdrop-filter: blur(12px); 

      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25); 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); 

      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #1a1a1a;
      box-sizing: border-box;
    }
    
  </style>
</head>
<body>

  <div class="tarjeta">
    <h1><strong>I still don't get how you love me so much.</strong> 🌸</h1>
    
    <div class="jardin">
      <div class="flor">
        <div class="petalo p1"></div>
        <div class="petalo p2"></div>
        <div class="petalo p3"></div>
        <div class="petalo p4"></div>
        <div class="petalo p5"></div>
        <div class="petalo p6"></div>
        <div class="centro"></div>
      </div>

      <div class="tallo"></div>
      <div class="hoja hoja-izq"></div>
      <div class="hoja hoja-der"></div>
      <div class="maceta"></div>
    </div>
    <div class="glass-card">
      <p>You're the first thing on my mind every morning.☀️</p>
    </div>
    <div class="glass-card">
      <p><Strong>I love you so much, honey ❤️</Strong></p>
    </div>
    <img src="foto.jpg" alt="foto con el amor de mi vida" class="photo">
    <br><br>

    <div class="player-card">
     <img src="album.jpg" alt="Portada Cancion" class="photo_2">

     <div class="track-info">
        <h2 class="title">How Deep Is Your Love</h2>
        <p class="artist">Bee Gees</p>
    </div>

      <audio id="miCancion" src="how-deep-is-your-love.mp3"></audio>

      <button onclick="document.getElementById('miCancion').play()">▶ Play</button>
      <button onclick="document.getElementById('miCancion').pause()">⏸ Pausa</button>
    </div>



  </div>

</body>
</html>
